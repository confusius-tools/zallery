# The defaults of `[tool.zallery]`, which Zallery reads from the `pyproject.toml`
# of a project. A key the project sets replaces the value here. Relative paths
# resolve against the directory of that `pyproject.toml`.

[tool.zallery]

# Directory of example sections.
examples = "docs/examples"

# Where rendered pages and images go. Not set: the `_built` directory in
# `examples`.
# built = "docs/examples/_built"

# Execution/render cache.
cache = ".gallery-cache"

# `owner/repo` for the Binder launch badges. Not set: no Binder badge.
# binder_repo = "owner/repo"

# Integration classes of the project, as "module:Class" names. A class that
# subclasses one Zallery ships takes its place; any other is added. The classes
# Zallery ships are in effect without being named here:
# `zallery.integration.matplotlib:Matplotlib`, `zallery.integration.plotly:Plotly`,
# `zallery.integration.pyvista:PyVista` and `zallery.integration.xarray:Xarray`.
integrations = []

# Files whose change invalidates the cache.
fingerprint = ["uv.lock"]

# Whether an HTML output may be the thumbnail of an example, pictured by a
# headless browser.
html_thumbnails = false

# Stylesheets of the site applied to that picture.
html_thumbnail_css = []
