# The defaults of `[tool.zallery]`, which Zallery reads from the `pyproject.toml` of a
# project. A key the project sets replaces the value here. Relative paths resolve
# against the directory of that `pyproject.toml`.

[tool.zallery]

# Directory of example sections.
gallery_root = "docs/examples"

# Where rendered pages and images go. Not set: the `_built` directory under
# `gallery_root`.
# built = "docs/examples/_built"

# Execution/render cache.
cache = ".zallery-cache"

# `owner/repo` for the Binder launch badges. Not set: no Binder badge.
# binder_repo = "owner/repo"

# Integration classes of the project, as "module:Class" names. A class that subclasses
# one that Zallery ships will takes its place; any other is added. The classes that
# ships with Zallery are not named here:
# `zallery.integration.matplotlib:Matplotlib`, `zallery.integration.plotly:Plotly`,
# `zallery.integration.pyvista:PyVista` and `zallery.integration.xarray:Xarray`.
integrations = []

# Other files whose change invalidates the cache. The lockfile is there so that a
# change of a dependency runs the examples again. A cached example is reused while
# these files and all of the following are unchanged; the following need no entry
# here:
# - the source of the example;
# - the Python version;
# - the values of `gallery_root`, `built`, `binder_repo`, `integrations` and
#   `html_thumbnails`;
# - the Zallery sources;
# - the module of each integration class of the project;
# - the `html_thumbnail_css` stylesheets;
# - with `html_thumbnails` on, whether the build found a browser to picture the
#   HTML thumbnails with. Examples built without one are built again once a
#   browser is there.
fingerprint = ["uv.lock"]

# Whether an HTML output may be the thumbnail of an example, pictured by a
# headless browser.
html_thumbnails = false

# Stylesheets of the site applied to that picture.
html_thumbnail_css = []

# Whether an example page lists, at its end, the objects of the package of the
# project that the example uses, as cross-references to their API documentation.
# The package is the `name` of `[project]`, as it is imported. The site needs
# mkdocstrings, which resolves the cross-references; with its `backlinks` option,
# the documentation of an object then lists the pages that reference it. To show
# only the examples, each as its card of the gallery index, name the folder of
# `api_templates` as the `custom_templates` of mkdocstrings.
api_references = false

# Folder Zallery writes its mkdocstrings templates to on every build, with
# `api_references` on. mkdocstrings reads one templates folder: a site that has
# its own names it here, and Zallery adds its files to it. Not set: the
# `mkdocstrings` folder of the cache.
# api_templates = ".zallery-cache/mkdocstrings"
