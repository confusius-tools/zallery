[project]
site_name = "Zallery"
site_description = "Light-and-dark example galleries for Zensical docs, built from jupytext scripts."
site_author = "ConfUSIus developers"
copyright = "Copyright © 2026 The ConfUSIus developers"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/confusius-tools/zallery"
repo_name = "confusius-tools/zallery"
extra_css = ["stylesheets/extra.css"]
# The example pages are generated by `just gallery`; list new ones here.
nav = [
    { "Home" = "index.md" },
    { "User guide" = [
        { "Writing examples" = "user-guide/writing-examples.md" },
        { "Light and dark figures" = "user-guide/light-and-dark-figures.md" },
        { "Integrations" = "user-guide/integrations.md" },
        { "Plotly figures" = "user-guide/plotly-figures.md" },
        { "PyVista plots" = "user-guide/pyvista-plots.md" },
        { "HTML thumbnails" = "user-guide/html-thumbnails.md" },
        { "API references" = "user-guide/api-references.md" },
        { "Configuration" = "user-guide/configuration.md" },
        { "Zensical integration" = "user-guide/zensical-integration.md" },
    ]},
    { "Examples" = [
        { "Overview" = "examples/index.md" },
        { "Matplotlib figures" = [
            { "A first plot" = "examples/_built/matplotlib/first_plot.md" },
            { "Choosing the thumbnail" = "examples/_built/matplotlib/choose_thumbnail.md" },
            { "A palette for each color scheme" = "examples/_built/matplotlib/palettes.md" },
            { "How a figure gets its dark look" = "examples/_built/matplotlib/dark_look.md" },
        ]},
        { "When things go wrong" = [
            { "An example that raises" = "examples/_built/errors/raise_error.md" },
        ]},
        { "Zensical syntax" = [
            { "Writing an admonition" = "examples/_built/zensical/write_admonition.md" },
            { "Cells in tabs" = "examples/_built/zensical/tab_cells.md" },
            { "Highlighted lines and a title" = "examples/_built/zensical/highlight_lines.md" },
            { "Code annotations" = "examples/_built/zensical/annotations.md" },
        ]},
        { "Rich outputs" = [
            { "HTML outputs" = "examples/_built/outputs/html_outputs.md" },
            { "A pandas DataFrame" = "examples/_built/outputs/pandas.md" },
            { "xarray objects" = "examples/_built/outputs/xarray.md" },
            { "An HTML output as the thumbnail" = "examples/_built/outputs/html_thumbnail.md" },
            { "Plotly figures" = "examples/_built/outputs/plotly.md" },
            { "PyVista plots" = "examples/_built/outputs/pyvista.md" },
            { "An integration of your own" = "examples/_built/outputs/integration.md" },
        ]},
    ]},
    { "API reference" = [
        { "zallery" = "api/zallery.md" },
        { "zallery.integration" = "api/integration.md" },
        { "zallery.integration.matplotlib" = "api/matplotlib.md" },
        { "zallery.integration.plotly" = "api/plotly.md" },
        { "zallery.integration.pyvista" = "api/pyvista.md" },
        { "zallery.integration.xarray" = "api/xarray.md" },
    ]},
]

[project.validation]
unresolved_references = false

[project.theme]
variant = "modern"
language = "en"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.expand",
    "navigation.indexes",
    "navigation.instant",
    "toc.follow",
    "content.code.copy",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# What Zallery's pages need: grids and buttons (attr_list, md_in_html), collapsed
# code cells (admonition, details), fenced code inside those (superfences).
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
toc_depth = 3
permalink = true

# The home page is the README.
[project.markdown_extensions.pymdownx.snippets]

# The API reference is written from the docstrings. With `backlinks`, each object
# lists the pages that reference it. The template in `tools/mkdocstrings` keeps
# the examples that use it, which reference it since `api_references` is on in
# `[tool.zallery]` of `pyproject.toml`.
[project.plugins.mkdocstrings]
custom_templates = "tools/mkdocstrings"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
docstring_section_style = "list"
members_order = "source"
filters = ["!^_"]
heading_level = 2
show_root_heading = true
show_source = false
show_symbol_type_toc = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
merge_init_into_class = true
inherited_members = true
backlinks = "tree"
