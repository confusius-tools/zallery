[project]
site_name = "zallery"
site_description = "Light-and-dark example galleries for Zensical docs, built from jupytext scripts."
site_author = "ConfUSIus developers"
copyright = "Copyright © 2026 The ConfUSIus developers"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/confusius-tools/zallery"
repo_name = "confusius-tools/zallery"
extra_css = ["stylesheets/extra.css"]
# The example pages are generated by `just gallery`; list new ones here.
nav = [
    { "Home" = "index.md" },
    { "Examples" = [
        { "Overview" = "examples/index.md" },
        { "Matplotlib figures" = [
            { "A first plot" = "examples/_built/matplotlib/first_plot.md" },
            { "Choosing the thumbnail" = "examples/_built/matplotlib/choose_thumbnail.md" },
        ]},
        { "When things go wrong" = [
            { "An example that raises" = "examples/_built/errors/raise_error.md" },
        ]},
        { "Admonitions" = [
            { "Writing an admonition" = "examples/_built/admonitions/write_admonition.md" },
        ]},
    ]},
]

[project.validation]
unresolved_references = false

[project.theme]
variant = "modern"
language = "en"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.expand",
    "navigation.indexes",
    "navigation.instant",
    "toc.follow",
    "content.code.copy",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# What zallery's pages need: grids and buttons (attr_list, md_in_html), collapsed
# code cells (admonition, details), fenced code inside those (superfences).
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
toc_depth = 3
permalink = true

# The home page is the README.
[project.markdown_extensions.pymdownx.snippets]
